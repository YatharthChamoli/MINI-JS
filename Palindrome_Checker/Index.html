<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palindrome Checker</title>
  <link rel="stylesheet" href="Style.css" />
</head>

<body>
  <div class="wrapper">
    <div class="card">
      <h1>Palindrome Checker</h1>
      <p class="subtitle">Check if a word or sentence is a palindrome 🔄</p>

      <div class="input-group">
        <input type="text" placeholder="Type something…" id="input" autocomplete="off" />
        <button id="checkBtn">Check</button>
      </div>

      <p id="result" class="result-message"></p>
      <p class="hint">Tip: Spaces and letter case are ignored.</p>
    </div>
  </div>

  <script src="Main.js"></script>
</body>

</html>
